<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — DB Sentinel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #151e33 0%, #0a0e17 80%);
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: #111827;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 212, 255, 0.1);
            border-radius: 16px;
        }
        .brand-logo-large {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(124, 58, 237, 0.2));
            border: 1px solid rgba(0, 212, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
        }
    </style>
</head>
<body>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;"></div>

    <div class="login-card p-4 p-sm-5">
        <div class="text-center mb-4">
            <div class="brand-logo-large">
                <i class="fas fa-shield-halved fa-2x text-cyan"></i>
            </div>
            <h3 class="fw-bold text-white tracking-tight mb-1">DB SENTINEL</h3>
            <p class="text-secondary small">Database Inference Attack Detection System</p>
        </div>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="mb-3">
                <label for="username" class="form-label text-secondary small fw-semibold">USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control bg-darkest border-secondary border-opacity-50 text-white" id="username" placeholder="e.g. admin or analyst" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-secondary small fw-semibold">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary"><i class="fas fa-key"></i></span>
                    <input type="password" class="form-control bg-darkest border-secondary border-opacity-50 text-white" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="btnLogin" class="btn btn-cyber w-100 py-2 fw-semibold mb-3">
                <i class="fas fa-lock-open me-2"></i> Authenticate
            </button>
        </form>

        <!-- Quick Fill Helper Buttons for Demo -->
        <div class="border-top border-secondary border-opacity-25 pt-3 mt-2 text-center">
            <span class="text-secondary small d-block mb-2">Instant Demo Credentials:</span>
            <div class="d-flex justify-content-center gap-2">
                <button type="button" class="btn btn-sm btn-outline-cyan" onclick="quickFill('admin', 'admin123')">
                    <i class="fas fa-user-shield me-1"></i> Admin
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="quickFill('analyst', 'analyst123')">
                    <i class="fas fa-user me-1"></i> Analyst
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        function quickFill(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            if (!u || !p) return;
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';
            try {
                await Auth.login(u, p);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-lock-open me-2"></i> Authenticate';
            }
        }
    </script>
</body>
</html>
