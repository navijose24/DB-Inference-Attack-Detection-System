<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Analyst — DB Sentinel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #151e33 0%, #0a0e17 80%);
        }
        .register-card {
            width: 100%;
            max-width: 440px;
            background: #111827;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border-radius: 16px;
        }
    </style>
</head>
<body>
    <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;"></div>

    <div class="register-card p-4 p-sm-5">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-white tracking-tight mb-1">Create Account</h3>
            <p class="text-secondary small">Register new Security Analyst on DB Sentinel</p>
        </div>

        <form id="regForm" onsubmit="handleRegisterSubmit(event)">
            <div class="mb-3">
                <label for="username" class="form-label text-secondary small fw-semibold">USERNAME</label>
                <input type="text" class="form-control bg-darkest border-secondary border-opacity-50 text-white" id="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label text-secondary small fw-semibold">PASSWORD</label>
                <input type="password" class="form-control bg-darkest border-secondary border-opacity-50 text-white" id="password" required>
            </div>
            <div class="mb-4">
                <label for="role" class="form-label text-secondary small fw-semibold">ROLE</label>
                <select class="form-select bg-darkest border-secondary border-opacity-50 text-white" id="role">
                    <option value="analyst" selected>Security Analyst</option>
                    <option value="viewer">Viewer (Read-Only)</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>
            <button type="submit" id="btnRegister" class="btn btn-cyber w-100 py-2 fw-semibold mb-3">
                Register User
            </button>
            <div class="text-center">
                <a href="/login" class="small text-secondary"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const r = document.getElementById('role').value;
            if (!u || !p) return;
            const btn = document.getElementById('btnRegister');
            btn.disabled = true;
            try {
                await Auth.register(u, p, r);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
